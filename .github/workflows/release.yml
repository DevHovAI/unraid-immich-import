name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME" || { echo "VERSION ($(cat VERSION)) does not match $GITHUB_REF_NAME"; exit 1; }
      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push image
        run: |
          v="${GITHUB_REF_NAME#v}"
          img=ghcr.io/devhovai/unraid-immich-import
          # Pre-releases (e.g. 2.0.0-beta.1) get :beta instead of :latest
          if [[ "$v" == *-* ]]; then extra=beta; else extra=latest; fi
          docker build --build-arg VERSION="$v" \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.version="$v" \
            -t "$img:$v" -t "$img:$extra" .
          docker push "$img:$v"
          docker push "$img:$extra"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          pre=(); [[ "$v" == *-* ]] && pre=(--prerelease)
          # Older script versions fetch this file from the latest release on
          # /update – that way they get the last script version with the v2 notice.
          gh release create "$GITHUB_REF_NAME" legacy/camera-import-install.sh \
            --title "$GITHUB_REF_NAME" --notes-file notes.md "${pre[@]}"
