name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version und Installer prüfen
        run: |
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME" || { echo "VERSION ($(cat VERSION)) passt nicht zu $GITHUB_REF_NAME"; exit 1; }
          bash build.sh
          git diff --exit-code camera-import-install.sh
          bash -n camera-import-install.sh
      - name: Release mit camera-import-install.sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" camera-import-install.sh --title "$GITHUB_REF_NAME" --notes-file notes.md
