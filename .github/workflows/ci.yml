name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: Image bauen
        run: docker build --build-arg VERSION=ci -t camera-import:ci . && docker run --rm camera-import:ci --version

  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer aktuell?
        run: |
          cd legacy && bash build.sh
          git diff --exit-code camera-import-install.sh || { echo "legacy/camera-import-install.sh veraltet"; exit 1; }
      - name: Syntax und shellcheck
        run: |
          for f in legacy/user.scripts/*/script legacy/boot/camera-import/*.sh legacy/camera-import-install.sh; do bash -n "$f"; done
          shellcheck -x -P SCRIPTDIR legacy/user.scripts/*/script legacy/boot/camera-import/*.sh legacy/camera-import-install.sh
      - name: PHP-Syntax
        run: for f in legacy/boot/camera-import/*.php; do php -l "$f"; done
