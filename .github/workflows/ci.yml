name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          for f in user.scripts/*/script boot/camera-import/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck -x -P SCRIPTDIR user.scripts/*/script boot/camera-import/*.sh
